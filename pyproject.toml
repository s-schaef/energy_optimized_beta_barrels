[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barrel-builder"
version = "1.0.0"
description = "Build and coarsely screen rigid-body models of circular beta-barrel protein assemblies"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "MDAnalysis>=2.8",
    "biopython",
]

# PyRosetta (needed for scoring) is not on PyPI; see README for installation.

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
barrel-align = "barrel_builder.alignment:main"
barrel-build = "barrel_builder.ring_builder:main"
barrel-optimize = "barrel_builder.optimization:main"

[tool.setuptools]
packages = ["barrel_builder"]
